name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes do motor de áudio
        run: ./gradlew :core:test --stacktrace

      - name: Compilar APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Renomear APK
        run: |
          mkdir -p saida
          cp app/build/outputs/apk/release/app-release.apk "saida/TVHuntterDJ-v1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TVHuntterDJ-apk
          path: saida/*.apk

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: TV Huntter DJ v1.0.${{ github.run_number }}
          make_latest: true
          body: |
            APK de teste do app **TV Huntter DJ**.
            Baixe o arquivo `.apk` abaixo pelo celular e instale (permita "instalar apps desconhecidos").
          files: saida/*.apk
